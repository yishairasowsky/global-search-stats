<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Oxford English Dictionary</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <style>
    body { font-family: Georgia, serif; margin:0; background:#f2f2f2; }

    .topbar {
      background:#002147;
      color:#fff;
      padding:12px 20px;
      font-size:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topbar input {
      width:280px;
      padding:7px 10px;
      font-size:14px;
      border-radius:4px;
      border:0;
    }

    .nav {
      background:#e6e6e6;
      padding:8px 20px;
      font-size:14px;
      color:#333;
    }

    .nav span {
      cursor:pointer;
    }

    .nav span:hover {
      text-decoration: underline;
    }

    .wrap {
      max-width:1100px;
      margin:22px auto;
      background:#fff;
      padding:24px 26px;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
    }

    .alpha {
      text-align:center;
      margin-bottom:18px;
    }

    .alpha button {
      border:0;
      background:transparent;
      color:#002147;
      font-weight:700;
      cursor:pointer;
      padding:3px 6px;
      font-size:15px;
    }

    .alpha button.active {
      text-decoration: underline;
    }

    .meta {
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin-bottom:14px;
    }

    .letterTitle { font-size:34px; font-weight:800; }
    .pageInfo { font-size:13px; color:#666; }

    .cols {
      column-count:2;
      column-gap:44px;
      font-size:16px;
      line-height:1.3;
    }

    .entry {
      break-inside: avoid;
      margin-bottom:6px;
      font-weight:700;
      user-select:text;
    }

    .hint {
      margin-top:14px;
      font-size:12px;
      color:#777;
      column-span:all;
    }

    #loader {
      display:none;
      position:fixed;
      inset:0;
      background:#fff;
      z-index:9999;
      text-align:center;
      padding-top:220px;
      font-size:22px;
    }
  </style>
</head>

<body>

<div id="loader">Loading dictionary pages…</div>

<div class="topbar">
  <div><b>Oxford English Dictionary</b></div>
  <input id="search" placeholder="Search the dictionary…" autocomplete="off" />
</div>

<div class="nav">
  <span>Home</span> ·
  <span>Dictionaries</span> ·
  <span>Encyclopedias</span> ·
  <span>Subjects</span> ·
  <span>Browse A–Z</span>
</div>

<div class="wrap">
  <div class="alpha" id="alpha"></div>

  <div class="meta">
    <div class="letterTitle" id="letterTitle">A</div>
    <div class="pageInfo" id="pageInfo"></div>
  </div>

  <div class="cols" id="content"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
const WORDS_URL = "words.json";
const DB_URL = "https://global-search-stats-default-rtdb.firebaseio.com/chosenWord.json";
const PAGE_SIZE = 140;

let allWords = [];
let currentLetter = "A";
let filtered = [];
let rendered = 0;

function fakePageInfo(letter) {
  const vol = Math.max(1, Math.ceil((letter.charCodeAt(0) - 64) / 2));
  const base = 300 + (letter.charCodeAt(0) - 65) * 65;
  return `Oxford English Dictionary · Vol. ${vol} · pp. ${base}–${base + 6}`;
}

function buildAlpha() {
  const a = document.getElementById("alpha");
  a.innerHTML = "";
  for (let c = 65; c <= 90; c++) {
    const L = String.fromCharCode(c);
    const b = document.createElement("button");
    b.textContent = L;
    if (L === currentLetter) b.classList.add("active");
    b.onclick = () => goLetter(L);
    a.appendChild(b);
  }
}

function goLetter(L) {
  currentLetter = L;
  document.getElementById("letterTitle").textContent = L;
  document.getElementById("pageInfo").textContent = fakePageInfo(L);
  buildAlpha();
  applyFilter();
  window.scrollTo({ top: 0 });
}

function applyFilter() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  filtered = allWords.filter(w =>
    w.startsWith(currentLetter.toLowerCase()) &&
    (q.length < 2 || w.includes(q))
  );
  rendered = 0;
  document.getElementById("content").innerHTML = "";
  renderMore();
}

function renderMore() {
  const slice = filtered.slice(rendered, rendered + PAGE_SIZE);
  const c = document.getElementById("content");
  slice.forEach(w => {
    const d = document.createElement("div");
    d.className = "entry";
    d.textContent = w;
    c.appendChild(d);
  });
  rendered += slice.length;
  document.getElementById("hint").textContent =
    `Showing ${rendered.toLocaleString()} of ${filtered.length.toLocaleString()} entries · Scroll to continue`;
}

window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY > document.body.offsetHeight - 700) {
    if (rendered < filtered.length) renderMore();
  }
});

document.getElementById("search").addEventListener("input", applyFilter);

// 🔴 SEND HIGHLIGHTED WORD TO CONTROL PAGE (SILENT)
document.addEventListener("mouseup", () => {
  const sel = window.getSelection().toString().trim();
  if (sel.length >= 3 && sel.length <= 40 && !sel.includes(" ")) {
    fetch(DB_URL, { method: "PUT", body: JSON.stringify(sel) });
  }
});

async function init() {
  document.getElementById("loader").style.display = "block";
  const r = await fetch(WORDS_URL);
  allWords = (await r.json()).sort();
  document.getElementById("loader").style.display = "none";
  buildAlpha();
  goLetter(currentLetter);
}

init();
</script>

</body>
</html>
