<!DOCTYPE html>
<html>
<head>
  <title>Global Search Statistics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    ol {
      font-size: 18px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Top Searched Countries Worldwide</h1>
    <p>Based on aggregated global search engine queries. Updated hourly.</p>

    <ol id="countryList">
      <li>USA</li>
      <li>UK</li>
      <li>France</li>
      <li>Germany</li>
      <li>Brazil</li>
    </ol>

    <div class="footer">
      Global Search Analytics Report · 2026 Data Observatory
    </div>
  </div>
</body>
</html>
