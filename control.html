<!DOCTYPE html>
<html>
<head>
  <title>Control Monitor</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 24px; }
    .label { opacity: 0.5; margin-top: 24px; }
    .value { font-size: 34px; font-weight: bold; }
    #viewport {
      margin-top: 24px;
      height: 6px;
      background: #333;
      position: relative;
    }
    #marker {
      position: absolute;
      height: 6px;
      width: 40px;
      background: #fff;
    }
  </style>
</head>
<body>

<h1>Live Spectator Monitor</h1>

<div class="label">Hovering word</div>
<div id="hover" class="value">—</div>

<div class="label">Highlighted text</div>
<div id="highlighted" class="value">—</div>

<div class="label">Scroll position</div>
<div id="viewport">
  <div id="marker"></div>
</div>

<script>
const DB_URL = "https://global-search-stats-default-rtdb.firebaseio.com/state.json";

async function poll() {
  try {
    const r = await fetch(DB_URL + "?cache=" + Date.now());
    const s = await r.json();
    if (!s) return;

    if (s.hover) {
      document.getElementById("hover").textContent = s.hover;
    }
    if (s.highlighted) {
      document.getElementById("highlighted").textContent = s.highlighted;
    }
    if (typeof s.scroll === "number") {
      const marker = document.getElementById("marker");
      marker.style.left = Math.min(300, s.scroll / 10) + "px";
    }
  } catch {}
}

setInterval(poll, 150);
</script>

</body>
</html>
