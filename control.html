<!DOCTYPE html>
<html>
<head>
  <title>Control Monitor</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #111;
      color: #eee;
    }

    h1 {
      font-size: 22px;
      font-weight: normal;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    #word {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hint {
      margin-top: 30px;
      font-size: 13px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

<h1>Live Monitor</h1>

<div id="word">Waiting for selection…</div>

<div class="hint">
  Displays the most recently highlighted word.
</div>

<script>
const DB_URL = "https://global-search-stats-default-rtdb.firebaseio.com/chosenWord.json";

async function poll() {
  try {
    const r = await fetch(DB_URL + "?cache=" + Date.now());
    const w = await r.json();
    if (w) {
      document.getElementById("word").textContent = w;
    }
  } catch (e) {
    // fail silently — better than flashing errors during performance
  }
}

setInterval(poll, 700);
</script>

</body>
</html>
