<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
</head>

<body style="font-family:Arial; padding:40px;">
<h2>🧙 Control Panel</h2>
<h1 id="word">Waiting...</h1>

<script>
const DB_URL = "https://global-search-stats-default-rtdb.firebaseio.com/chosenWord.json";

async function pollWord() {
  const res = await fetch(DB_URL);
  const word = await res.json();
  if (word) document.getElementById("word").innerText = word;
}

setInterval(pollWord, 1000);
</script>

</body>
</html>
